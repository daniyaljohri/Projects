# Evaluation questions for the Olist pack.
# reference_sql is T-SQL against the chatbot views and is checked in SSMS.
# Questions in out_of_scope and adversarial have no reference_sql: they pass
# when Askit declines or the guardrails block the query.
# order_matters: true only when the question asks for a ranking or sequence.

questions:

  # simple: one view, one filter or count

  - id: s01
    category: simple
    question: How many orders are there in total?
    reference_sql: |
      SELECT COUNT(DISTINCT order_id) AS total_orders
      FROM chatbot.v_orders_full;
    order_matters: false
    notes: 98,666, not Olist's 99,441. 775 orders have no line items.

  - id: s02
    category: simple
    question: How many sellers are there?
    reference_sql: |
      SELECT COUNT(*) AS sellers
      FROM chatbot.v_seller_summary;
    order_matters: false

  - id: s03
    category: simple
    question: How many product categories are there?
    reference_sql: |
      SELECT COUNT(*) AS categories
      FROM chatbot.v_product_summary;
    order_matters: false

  - id: s04
    category: simple
    question: When was the first order placed and when was the last one?
    reference_sql: |
      SELECT
          MIN(order_purchase_timestamp) AS first_order,
          MAX(order_purchase_timestamp) AS last_order
      FROM chatbot.v_orders_full;
    order_matters: false

  - id: s05
    category: simple
    question: How many customers have placed more than one order?
    reference_sql: |
      SELECT COUNT(*) AS repeat_customers
      FROM chatbot.v_customer_summary
      WHERE total_orders > 1;
    order_matters: false
    notes: Customer summary counts fulfilled orders only.

  - id: s06
    category: simple
    question: How many orders were cancelled?
    reference_sql: |
      SELECT COUNT(DISTINCT order_id) AS cancelled_orders
      FROM chatbot.v_orders_full
      WHERE order_status = 'canceled';
    order_matters: false
    notes: Stored as 'canceled' (one l); the label column says Cancelled.

  # aggregation: totals and averages, with grain traps

  - id: a01
    category: aggregation
    question: What was total revenue and the number of orders in each year?
    reference_sql: |
      SELECT
          order_year,
          SUM(revenue_brl) AS total_revenue_brl,
          COUNT(DISTINCT order_id) AS total_orders
      FROM chatbot.v_orders_full
      GROUP BY order_year;
    order_matters: false
    notes: 2016 R$57,183.21 / 312; 2017 R$7,142,672.43 / 44,579; 2018 R$8,643,697.60 / 53,775.

  - id: a02
    category: aggregation
    question: What was the average order value in 2018?
    reference_sql: |
      SELECT AVG(order_revenue_brl) AS avg_order_value_brl
      FROM (
          SELECT order_id, SUM(revenue_brl) AS order_revenue_brl
          FROM chatbot.v_orders_full
          WHERE order_year = 2018
          GROUP BY order_id
      ) AS orders;
    order_matters: false
    notes: Grain trap. Averaging revenue_brl directly gives the average line, not the average order.

  - id: a03
    category: aggregation
    question: What is the average review score?
    reference_sql: |
      SELECT AVG(CAST(review_score AS FLOAT)) AS avg_review_score
      FROM (
          SELECT order_id, MAX(review_score) AS review_score
          FROM chatbot.v_orders_full
          GROUP BY order_id
      ) AS orders;
    order_matters: false
    notes: Grain trap. The review repeats on every line, so average per order. Orders without a review are ignored by AVG.

  - id: a04
    category: aggregation
    question: How much revenue came from each payment type?
    reference_sql: |
      SELECT payment_type, SUM(revenue_brl) AS total_revenue_brl
      FROM chatbot.v_orders_full
      GROUP BY payment_type;
    order_matters: false

  - id: a05
    category: aggregation
    question: What percentage of orders were paid by boleto?
    reference_sql: |
      SELECT 100.0 * COUNT(DISTINCT CASE WHEN payment_type = 'Boleto' THEN order_id END)
          / COUNT(DISTINCT order_id) AS boleto_pct
      FROM chatbot.v_orders_full;
    order_matters: false
    notes: Share of orders, not of lines. Scored on a 0 to 100 scale.

  - id: a06
    category: aggregation
    question: What is the average freight cost per order?
    reference_sql: |
      SELECT AVG(order_freight) AS avg_freight_per_order_brl
      FROM (
          SELECT order_id, SUM(line_item_freight) AS order_freight
          FROM chatbot.v_orders_full
          GROUP BY order_id
      ) AS orders;
    order_matters: false
    notes: Grain trap. Per order, not per item.

  - id: a07
    category: aggregation
    question: What is the late delivery rate for delivered orders?
    reference_sql: |
      SELECT 100.0 * SUM(is_late) / COUNT(*) AS late_rate_pct
      FROM (
          SELECT order_id, MAX(is_late) AS is_late
          FROM chatbot.v_orders_full
          WHERE order_status = 'delivered'
          GROUP BY order_id
      ) AS orders;
    order_matters: false
    notes: Grain trap. Late rate per delivered order, not per line.

  # join_detail: filters and breakdowns that need the detail view

  - id: j01
    category: join_detail
    question: How many orders and how much revenue came from customers in Rio de Janeiro city?
    reference_sql: |
      SELECT
          COUNT(DISTINCT order_id) AS total_orders,
          SUM(revenue_brl) AS total_revenue_brl
      FROM chatbot.v_orders_full
      WHERE customer_city = 'rio de janeiro';
    order_matters: false
    notes: Needs the lowercase city value.

  - id: j02
    category: join_detail
    question: How many orders contained more than one item?
    reference_sql: |
      SELECT COUNT(*) AS multi_item_orders
      FROM (
          SELECT order_id
          FROM chatbot.v_orders_full
          GROUP BY order_id
          HAVING COUNT(*) > 1
      ) AS orders;
    order_matters: false

  - id: j03
    category: join_detail
    question: How many orders included items from more than one seller?
    reference_sql: |
      SELECT COUNT(*) AS multi_seller_orders
      FROM (
          SELECT order_id
          FROM chatbot.v_orders_full
          GROUP BY order_id
          HAVING COUNT(DISTINCT seller_id) > 1
      ) AS orders;
    order_matters: false

  - id: j04
    category: join_detail
    question: How much health and beauty revenue came from sellers in Curitiba?
    reference_sql: |
      SELECT SUM(revenue_brl) AS total_revenue_brl
      FROM chatbot.v_orders_full
      WHERE product_category = 'health_beauty'
          AND seller_city = 'curitiba';
    order_matters: false
    notes: Needs the category code health_beauty and the lowercase city.

  - id: j05
    category: join_detail
    question: How many orders were shipped by sellers in São Paulo state to customers in other states?
    reference_sql: |
      SELECT COUNT(DISTINCT order_id) AS orders
      FROM chatbot.v_orders_full
      WHERE seller_state = 'SP'
          AND customer_state <> 'SP';
    order_matters: false
    notes: An order counts if any of its SP-seller lines went out of state.

  # date_time: periods, months and relative dates

  - id: d01
    category: date_time
    question: How many orders were placed in each month of 2017?
    reference_sql: |
      SELECT order_month, COUNT(DISTINCT order_id) AS total_orders
      FROM chatbot.v_orders_full
      WHERE order_year = 2017
      GROUP BY order_month;
    order_matters: false

  - id: d02
    category: date_time
    question: Which month had the highest revenue?
    reference_sql: |
      SELECT TOP 1 year, month, total_revenue_brl
      FROM chatbot.v_monthly_trends
      ORDER BY total_revenue_brl DESC;
    order_matters: false

  - id: d03
    category: date_time
    question: How many orders were placed in November 2016?
    reference_sql: |
      SELECT COUNT(DISTINCT order_id) AS total_orders
      FROM chatbot.v_orders_full
      WHERE order_year = 2016
          AND order_month = 11;
    order_matters: false
    notes: Trap. The answer is 0; November 2016 has no orders.

  - id: d04
    category: date_time
    question: How many orders were placed on Black Friday 2017 (24 November)?
    reference_sql: |
      SELECT COUNT(DISTINCT order_id) AS total_orders
      FROM chatbot.v_orders_full
      WHERE order_date = '2017-11-24';
    order_matters: false

  - id: d05
    category: date_time
    question: What share of revenue came from orders placed on weekends?
    reference_sql: |
      SELECT 100.0 * SUM(CASE WHEN ordered_on_weekend = 1 THEN revenue_brl ELSE 0 END)
          / SUM(revenue_brl) AS weekend_revenue_pct
      FROM chatbot.v_orders_full;
    order_matters: false

  - id: d06
    category: date_time
    question: What was the average delivery time in days for delivered orders in each year?
    reference_sql: |
      SELECT order_year, AVG(CAST(order_to_delivery_days AS FLOAT)) AS avg_delivery_days
      FROM (
          SELECT order_id, MAX(order_year) AS order_year, MAX(order_to_delivery_days) AS order_to_delivery_days
          FROM chatbot.v_orders_full
          WHERE order_status = 'delivered'
          GROUP BY order_id
      ) AS orders
      GROUP BY order_year;
    order_matters: false
    notes: Grain trap. Per order; multi-item orders would otherwise count several times.

  # ranking: top N, with a minimum volume where the measure is an average or rate

  - id: r01
    category: ranking
    question: Who is the top seller by revenue?
    reference_sql: |
      SELECT TOP 1 seller_id, total_revenue_brl
      FROM chatbot.v_seller_summary
      ORDER BY total_revenue_brl DESC;
    order_matters: false
    notes: 4869f7a5... in Guariba, SP, R$249,640.70.

  - id: r02
    category: ranking
    question: Which 5 customer states brought in the most revenue?
    reference_sql: |
      SELECT TOP 5 customer_state, SUM(revenue_brl) AS total_revenue_brl
      FROM chatbot.v_orders_full
      GROUP BY customer_state
      ORDER BY total_revenue_brl DESC;
    order_matters: true

  - id: r03
    category: ranking
    question: Which 5 product categories have the best average review score?
    reference_sql: |
      SELECT TOP 5 product_category, avg_review_score
      FROM chatbot.v_product_summary
      WHERE total_orders >= 50
      ORDER BY avg_review_score DESC;
    order_matters: true
    notes: Volume filter from the pack rules (categories with at least 50 orders).

  - id: r04
    category: ranking
    question: Which 5 sellers have the highest late delivery rate?
    reference_sql: |
      SELECT TOP 5 seller_id, late_delivery_rate_pct
      FROM chatbot.v_seller_summary
      WHERE total_orders >= 10
      ORDER BY late_delivery_rate_pct DESC;
    order_matters: false
    notes: Volume filter from the pack rules (sellers with at least 10 orders). Without it, one-order sellers at 100% top the list. Top 5, not 10, because positions 10 and 11 tie at 31.6%.

  - id: r05
    category: ranking
    question: Which customer state has the highest late delivery rate?
    reference_sql: |
      SELECT TOP 1 customer_state, 100.0 * SUM(is_late) / COUNT(*) AS late_rate_pct
      FROM (
          SELECT order_id, MAX(customer_state) AS customer_state, MAX(is_late) AS is_late
          FROM chatbot.v_orders_full
          WHERE order_status = 'delivered'
          GROUP BY order_id
      ) AS orders
      GROUP BY customer_state
      ORDER BY late_rate_pct DESC;
    order_matters: false
    notes: AL, 21.4% (85 of 397 delivered orders).

  - id: r06
    category: ranking
    question: Which 3 product categories sold the most units?
    reference_sql: |
      SELECT TOP 3 product_category, total_units_sold
      FROM chatbot.v_product_summary
      ORDER BY total_units_sold DESC;
    order_matters: true

  # complex: window functions, CTEs, views joined to each other

  - id: c01
    category: complex
    question: What was the month-over-month revenue growth in 2018?
    reference_sql: |
      WITH monthly AS (
          SELECT
              year, month, total_revenue_brl,
              LAG(total_revenue_brl) OVER (ORDER BY year, month) AS prev_revenue_brl
          FROM chatbot.v_monthly_trends
      )
      SELECT
          year, month, total_revenue_brl,
          100.0 * (total_revenue_brl - prev_revenue_brl) / prev_revenue_brl AS growth_pct
      FROM monthly
      WHERE year = 2018;
    order_matters: false
    notes: LAG over all months so January 2018 compares with December 2017. September 2018 is a few days only, so its drop is not real.

  - id: c02
    category: complex
    question: Show the running total of revenue by month for 2017.
    reference_sql: |
      SELECT
          month,
          total_revenue_brl,
          SUM(total_revenue_brl) OVER (ORDER BY month ROWS UNBOUNDED PRECEDING) AS running_revenue_brl
      FROM chatbot.v_monthly_trends
      WHERE year = 2017;
    order_matters: false

  - id: c03
    category: complex
    question: What is the top product category by revenue in each of the 5 biggest customer states?
    reference_sql: |
      WITH state_cat AS (
          SELECT customer_state, product_category, SUM(revenue_brl) AS revenue_brl
          FROM chatbot.v_orders_full
          WHERE product_category IS NOT NULL
          GROUP BY customer_state, product_category
      ),
      ranked AS (
          SELECT
              customer_state, product_category, revenue_brl,
              ROW_NUMBER() OVER (PARTITION BY customer_state ORDER BY revenue_brl DESC) AS rn,
              SUM(revenue_brl) OVER (PARTITION BY customer_state) AS state_revenue_brl
          FROM state_cat
      ),
      top_states AS (
          SELECT TOP 5 customer_state
          FROM ranked
          WHERE rn = 1
          ORDER BY state_revenue_brl DESC
      )
      SELECT r.customer_state, r.product_category, r.revenue_brl
      FROM ranked AS r
      JOIN top_states AS t ON t.customer_state = r.customer_state
      WHERE r.rn = 1;
    order_matters: false
    notes: Biggest states by revenue (SP, RJ, MG, RS, PR). Products without a category left out.

  - id: c04
    category: complex
    question: What share of 2018 revenue came from Platinum tier sellers?
    reference_sql: |
      SELECT
          100.0 * SUM(CASE WHEN s.seller_tier = 'Platinum' THEN o.revenue_brl ELSE 0 END)
              / SUM(o.revenue_brl) AS platinum_revenue_pct
      FROM chatbot.v_orders_full AS o
      JOIN chatbot.v_seller_summary AS s ON s.seller_id = o.seller_id
      WHERE o.order_year = 2018;
    order_matters: false
    notes: Needs a join, because the tier is only in the seller summary.

  - id: c05
    category: complex
    question: How many sellers make up half of all revenue?
    reference_sql: |
      WITH ranked AS (
          SELECT
              seller_id,
              SUM(total_revenue_brl) OVER (ORDER BY total_revenue_brl DESC, seller_id ROWS UNBOUNDED PRECEDING) AS running_revenue_brl,
              SUM(total_revenue_brl) OVER () AS all_revenue_brl
          FROM chatbot.v_seller_summary
      )
      SELECT COUNT(*) + 1 AS sellers_for_half
      FROM ranked
      WHERE running_revenue_brl < 0.5 * all_revenue_brl;
    order_matters: false
    notes: Pareto question. The smallest number of top sellers whose revenue reaches 50%.

  - id: c06
    category: complex
    question: On average, how many days pass between a customer's first and second order?
    reference_sql: |
      WITH orders AS (
          SELECT DISTINCT customer_unique_id, order_id, order_purchase_timestamp
          FROM chatbot.v_orders_full
      ),
      numbered AS (
          SELECT
              customer_unique_id, order_purchase_timestamp,
              ROW_NUMBER() OVER (PARTITION BY customer_unique_id ORDER BY order_purchase_timestamp, order_id) AS rn
          FROM orders
      )
      SELECT AVG(CAST(DATEDIFF(day, CAST(f.order_purchase_timestamp AS DATE), CAST(s.order_purchase_timestamp AS DATE)) AS FLOAT)) AS avg_days_to_second_order
      FROM numbered AS f
      JOIN numbered AS s
          ON s.customer_unique_id = f.customer_unique_id
          AND s.rn = 2
      WHERE f.rn = 1;
    order_matters: false
    notes: All order statuses. Days counted as calendar days, so dates are cast first and SQL Server and SQLite agree. Some second orders are placed the same day (0 days).

  - id: c07
    category: complex
    question: Do customers whose first order got a bad review (1 or 2) come back less often than those who gave 4 or 5?
    reference_sql: |
      WITH orders AS (
          SELECT customer_unique_id, order_id, MIN(order_purchase_timestamp) AS purchased_at, MAX(review_score) AS review_score
          FROM chatbot.v_orders_full
          GROUP BY customer_unique_id, order_id
      ),
      numbered AS (
          SELECT
              customer_unique_id, review_score,
              ROW_NUMBER() OVER (PARTITION BY customer_unique_id ORDER BY purchased_at, order_id) AS rn,
              COUNT(*) OVER (PARTITION BY customer_unique_id) AS order_count
          FROM orders
      )
      SELECT
          CASE WHEN review_score <= 2 THEN 'Negative' ELSE 'Positive' END AS first_review,
          COUNT(*) AS customers,
          100.0 * SUM(CASE WHEN order_count > 1 THEN 1 ELSE 0 END) / COUNT(*) AS repeat_rate_pct
      FROM numbered
      WHERE rn = 1
          AND (review_score <= 2 OR review_score >= 4)
      GROUP BY CASE WHEN review_score <= 2 THEN 'Negative' ELSE 'Positive' END;
    order_matters: false
    notes: First order per customer by purchase time; neutral (3) and unreviewed first orders left out.

  - id: c08
    category: complex
    question: Who is the top seller by revenue in each of SP, RJ and MG?
    reference_sql: |
      WITH ranked AS (
          SELECT
              seller_state, seller_id, total_revenue_brl,
              ROW_NUMBER() OVER (PARTITION BY seller_state ORDER BY total_revenue_brl DESC) AS rn
          FROM chatbot.v_seller_summary
          WHERE seller_state IN ('SP', 'RJ', 'MG')
      )
      SELECT seller_state, seller_id, total_revenue_brl
      FROM ranked
      WHERE rn = 1;
    order_matters: false
    notes: Seller state, not customer state.

  # ambiguous: underspecified, reference follows the pack's rules

  - id: m01
    category: ambiguous
    question: How many orders did we get last month?
    reference_sql: |
      SELECT COUNT(DISTINCT order_id) AS total_orders
      FROM chatbot.v_orders_full
      WHERE order_year = 2018
          AND order_month = 8;
    order_matters: false
    notes: Relative dates follow the end of the data (2018-09-03). Last full month = August 2018.

  - id: m02
    category: ambiguous
    question: How much revenue came from repeat customers?
    reference_sql: |
      SELECT SUM(total_revenue_brl) AS repeat_customer_revenue_brl
      FROM chatbot.v_customer_summary
      WHERE total_orders > 1;
    order_matters: false
    notes: Repeat customer = more than one fulfilled order.

  - id: m03
    category: ambiguous
    question: Is the business growing?
    reference_sql: |
      SELECT order_year, SUM(revenue_brl) AS total_revenue_brl
      FROM chatbot.v_orders_full
      WHERE order_month BETWEEN 1 AND 8
          AND order_year IN (2017, 2018)
      GROUP BY order_year;
    order_matters: false
    notes: Fair comparison is January to August, the months both years have in full. Many answers are defensible; the model passes only if it lands on this one.

